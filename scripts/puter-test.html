    // Decode function
    function decodePrompt() {
      return atob(base64Prompt);
    }
    
    function showPrompt() {
      const prompt = decodePrompt();
      document.getElementById('response').textContent = prompt.substring(0, 5000) + '\n\n... [truncated, ' + prompt.length + ' total chars]';
    }
    
    async function runTest() {
      const statusEl = document.getElementById('status');
      const responseEl = document.getElementById('response');
      
      try {
        const prompt = decodePrompt();
        statusEl.textContent = 'Decoding prompt... ' + prompt.length + ' chars';
        
        statusEl.textContent = 'Sending to GPT-5 nano... (this may take a while)';
        
        const response = await puter.ai.chat(prompt, {
          model: 'google/gemini-2.0-flash-lite',
        });
        
        statusEl.textContent = 'Response received!';
        responseEl.textContent = typeof response === 'string' ? response : JSON.stringify(response, null, 2);
        
      } catch (error) {
        statusEl.textContent = 'Error!';
        statusEl.className = 'error';
        responseEl.textContent = error.message || String(error);
        responseEl.className = 'error';
      }
    }
